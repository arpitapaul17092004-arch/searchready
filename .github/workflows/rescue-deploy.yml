name: Rescue Deploy

# One-time direct deploy via the Netlify MCP proxy (used when the Git
# webhook is unavailable). The proxy URL lives in the NETLIFY_RESCUE_PROXY
# secret and is deleted after use. This workflow self-deletes afterwards.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Direct deploy to Netlify (waits for the build)"
        run: |
          npx -y @netlify/mcp@latest \
            --site-id 7885f6f5-f2ed-45f6-8a00-6babc1f08897 \
            --proxy-path "$NETLIFY_RESCUE_PROXY"
        env:
          NETLIFY_RESCUE_PROXY: ${{ secrets.NETLIFY_RESCUE_PROXY }}
