name: Netlify Deploy (manual)

# One-shot deploy of the current main branch to Netlify.
# Uses the NETLIFY_MCP_PROXY secret (ephemeral Netlify deploy token,
# set via the Netlify MCP connector). For continuous deploys, connect
# the repo to Netlify via Git (app.netlify.com → Import from Git);
# netlify.toml already defines the build.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Netlify (build runs on Netlify)
        env:
          NETLIFY_PROXY: ${{ secrets.NETLIFY_MCP_PROXY }}
        run: |
          if [ -z "$NETLIFY_PROXY" ]; then
            echo "NETLIFY_MCP_PROXY secret is not set — nothing to do."
            exit 1
          fi
          npx -y @netlify/mcp@latest --site-id 7885f6f5-f2ed-45f6-8a00-6babc1f08897 --proxy-path "$NETLIFY_PROXY"
